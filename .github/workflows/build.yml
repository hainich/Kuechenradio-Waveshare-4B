name: ESP32-S3 Küchenradio Firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Native tests
        run: bash tests/run.sh
      - name: ESP-IDF 5.5.5 Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
      - name: Full flash image and byte-level verification
        run: python3 tools/merge_firmware.py build/flasher_args.json build/Kuechenradio_4B_Flash_0x0.bin
      - name: Firmwarecheck
        run: |
          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin
          test -s build/kuechenradio_waveshare_4b.bin
          test -s build/Kuechenradio_4B_Flash_0x0.bin
          test -s build/flasher_args.json
      - name: Firmware archive
        uses: actions/upload-artifact@v4
        with:
          name: Kuechenradio-Waveshare-4B-Firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/kuechenradio_waveshare_4b.bin
            build/Kuechenradio_4B_Flash_0x0.bin
            build/kuechenradio_waveshare_4b.elf
            build/flasher_args.json
          if-no-files-found: error
