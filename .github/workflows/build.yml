name: ESP32-S3 Küchenradio Firmware
on:
  push:
    branches: [main, audio-atlascube-codecs, audio-recovery-from-36, diagnose-from-49, fix-audio-memory-from-55, rollback56-pwr-from58, touch-audio-async-nvs-from60, pcm-writer-patch-from63, diagnostic-lab-from64, diagnostics-extended-from65, diagnostic-lowmem-web-from66, diagnostic-68-allocation-origin, diagnostic-69-pcm-analysis, diagnostic-70-ram-pressure, v71-audio-buffer, v72-heap-failure-trace]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Native tests
        run: bash tests/run.sh
      - name: ESP-IDF 5.5.5 Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
      - name: Verify RGB bandwidth mitigations in effective sdkconfig
        run: |
          grep -qx 'CONFIG_BSP_LCD_RGB_BUFFER_NUMS=1' sdkconfig
          grep -qx 'CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y' sdkconfig
          grep -qx 'CONFIG_SPIRAM_RODATA=y' sdkconfig
          grep -qx 'CONFIG_COMPILER_OPTIMIZATION_PERF=y' sdkconfig
          grep -qx '# CONFIG_LCD_RGB_RESTART_IN_VSYNC is not set' sdkconfig
          grep -qx 'CONFIG_SPIRAM_SPEED=80' sdkconfig
          grep -qx 'CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=240' sdkconfig
          grep -qx 'CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y' sdkconfig
      - name: Verify audio architecture before packaging
        run: |
          grep -q 'esp_wifi_set_ps(WIFI_PS_NONE)' main/radio_wifi.c
          grep -q 'MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT' main/radio_stream.c
          grep -q 'heap_caps_malloc(AUDIO_PCM_CAPACITY' main/radio_stream.c
          grep -q 'MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT' main/radio_stream.c
          grep -q 'pcm_writer_task' main/radio_stream.c
          grep -q 'RD_AUDIO_FIFO_PSRAM' main/radio_stream.c
          grep -q 'xTaskCreatePinnedToCore(http_receiver_task' main/radio_stream.c
          grep -q 'esp_audio_simple_dec_process' main/radio_stream.c
          grep -q 'esp_codec_dev_write(s_speaker, chunk' main/radio_stream.c
          grep -q 'radio_config_get_volume' main/radio_stream.c
          grep -q 'radio_config_ui_persist_poll' main/radio_wifi.c
          ! grep -q 'if (persist_now) persist(' main/radio_config.c
          ! grep -q 'int16_t \*mono' main/radio_stream.c
          grep -q 'radio_power_button_init' main/radio_ui.c
          grep -q 'radio_diag_pcm_underrun' main/radio_stream.c
          grep -q 'test_tone_play' main/radio_stream.c
          grep -q 'radio_lab_web_register' main/radio_web.c
          grep -q 'radio_diag_touch_press' main/radio_ui.c
          grep -q 'RADIO_DIAG_SAMPLES 1800' main/radio_diag.h
          grep -q 'radio_diag_http_inflight' main/radio_stream.c
          grep -q 'radio_diag_http_open' main/radio_stream.c
          grep -q 'radio_diag_extended_events' main/radio_lab_web.c
          grep -q 'wifi_ap_record_t ap_info' main/radio_wifi.c
          grep -q 'heap_caps_register_failed_alloc_callback' main/radio_diag.c
          grep -q 'radio_diag_live_snapshot' main/radio_lab_web.c
          grep -q 's_applied_interval_ms' main/radio_ui.c
          grep -q 'radio_diag_pcm_push_wait' main/radio_stream.c
          grep -q 'radio_diag_codec_mutex_wait' main/radio_stream.c
          grep -q 'lru_purge_enable = true' main/radio_web.c
          grep -q 'kuechenradio72_diagnose.csv' main/radio_lab_web.c
          grep -q 'esp_audio_dec_register_default' main/radio_stream.c
      - name: Build update and factory images
        run: |
          cp build/kuechenradio_waveshare_4b.bin "$RUNNER_TEMP/Küchenradio.bin"
          python3 tools/merge_firmware.py build/flasher_args.json "$RUNNER_TEMP/Kuechenradio_FACTORY_RESET_0x0.bin"
      - name: Firmwarecheck
        run: |
          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin
          test -s build/kuechenradio_waveshare_4b.bin
          cmp build/kuechenradio_waveshare_4b.bin "$RUNNER_TEMP/Küchenradio.bin"
          test -s "$RUNNER_TEMP/Kuechenradio_FACTORY_RESET_0x0.bin"
          test -s build/flasher_args.json
      - name: Küchenradio update archive (preserves WLAN)
        uses: actions/upload-artifact@v4
        with:
          name: Küchenradio-Update
          path: ${{ runner.temp }}/Küchenradio.bin
          if-no-files-found: error
      - name: Factory reset archive (erases WLAN)
        uses: actions/upload-artifact@v4
        with:
          name: Küchenradio-Factory-Reset
          path: |
            ${{ runner.temp }}/Kuechenradio_FACTORY_RESET_0x0.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error
